name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLIPPINGS_ARENA_API_KEY: "i-am-an-arena-api-key"
  CLIPPINGS_ARENA_MAIN_CHANNEL_ID: "i-am-an-arena-channel-id"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: test
        name: 🧪 Run tests
        run: npm run test -- --coverage

      - id: test-upload-coverage
        name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

      - id: test-upload-results
        name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report.junit.xml

  check:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: astro-check
        name: ♍️ Run Astro check
        run: npm run check

  lint:
    runs-on: ubuntu-latest

    outputs:
      format-outcome: ${{ steps.format-check.outcome }}
      lint-outcome: ${{ steps.lint-check.outcome }}

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: format-check
        name: 💅 Run format check
        run: npm run format

      - id: lint-check
        name: 🚨 Run lint check
        run: npm run lint
